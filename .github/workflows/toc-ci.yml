name: TOC & Content Quality

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  toc:
    name: TOC Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Regenerate in-file TOCs
        run: python tools/toc_generator.py --all --apply .

      - name: Fail if TOCs are stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "In-file TOCs are outdated. Run: python tools/toc_generator.py --all --apply ."
            git --no-pager diff --stat | cat
            exit 1
          fi

      - name: Validate TOCs
        run: python tools/toc_validate.py --all .

  content-quality:
    name: Content Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run content quality gate
        run: python tools/ci_quality_gate.py
